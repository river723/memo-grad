name: Build Unsigned iOS IPA

# 在 Windows 上无 Mac、无付费 Apple 账号时，用 GitHub 托管的 macOS runner
# 构建「未签名 ipa」，再用 Sideloadly 在本机拿免费 Apple ID 重签名安装。
#
# 双形态（2026-08 统一代码库后）：
#   手动触发时选 mode：
#     online  → 网络版（默认；push 自动触发也固定出网络版）
#     offline → 单机版（EXPO_PUBLIC_OFFLINE_MODE=1，免登录/AI 本地 Key/本地内容）
#   两种 ipa 的 Sideloadly 重签名安装流程完全相同，仅 JS bundle 内联的
#   EXPO_PUBLIC_* 环境变量不同。
#
# 单机版差异化（2026-08-26 起，与 build-android.yml 一致）：mode=offline 时在
# prebuild 前临时改 app.json——bundle id 改为 com.kaoyan.vocabulary.offline、
# 显示名改为「考研单词·离线」，与网络版可共存于一台设备，数据各自沙箱。
# 注意：不同 bundle id 在免费 Apple ID 下各占一个签名名额（约 10 个上限）。
# 详见 .claude/plans/ipad-iphone-sprightly-moore.md

on:
  workflow_dispatch:      # 允许在 Actions 页面手动触发
    inputs:
      mode:
        description: '构建形态：online=网络版 / offline=单机版'
        type: choice
        options: [online, offline]
        default: online
  push:
    branches: [main, NetDict]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'webpack.config.js'
      - 'assets/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://192.168.1.8:5888
      # 形态开关：手动触发按 mode 派生；push 触发 inputs.mode 为空 → 固定 online
      # Metro 在 xcodebuild 打包阶段静态内联 EXPO_PUBLIC_*（与 API_URL 同机制）
      EXPO_PUBLIC_OFFLINE_MODE: ${{ inputs.mode == 'offline' && '1' || '0' }}
      EXPO_PUBLIC_USE_REMOTE_CONTENT: ${{ inputs.mode == 'offline' && 'false' || 'true' }}
      # CI 环境跳过交互式更新检查
      CI: true
      # 注意：不要设置 RCT_NEW_ARCH_ENABLED=0 之类变量试图关闭新架构——
      # RN 0.82 起旧架构已移除，new_architecture.rb 中 new_arch_enabled 硬编码返回 true，
      # pod install 只会打印 "NEW ARCH ONLY" 警告，应用仍以新架构运行。
      # 之前的启动闪退根因是 JS 未捕获异常（AppNavigator 中 web 专用的 document.title
      # 在原生端抛 ReferenceError），已在 App.tsx/AppNavigator.tsx 修复并加了全局兜底。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 显式选择最新的 Xcode 26.x。Expo SDK 55 的 expo-modules-core 采用 Swift 6
      # 语言模式，用到了 Xcode 26（Swift 6.2）才转正的「隔离一致性」语法
      # （`class ... : @MainActor Protocol`），Xcode 15/16 会报
      # "unknown attribute 'MainActor'" 等 Swift 并发错误。
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26.x found"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swiftc --version

      # 单机版差异化：push 触发时 inputs.mode 为空自动跳过（= 网络版默认值）。
      # ios/ 由下一步 prebuild 从 app.json 生成，改 expo.name 即驱动
      # CFBundleDisplayName/workspace/scheme 名，bundle id 同步替换。
      - name: Differentiate offline build (bundle id + display name)
        if: inputs.mode == 'offline'
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.name = '考研单词·离线';
            j.expo.ios.bundleIdentifier = 'com.kaoyan.vocabulary.offline';
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          "
          grep -E '"name"|bundleIdentifier' app.json

      # Expo SDK 55 使用本地 CLI（npx expo），无需全局 expo-cli / eas-cli。
      # prebuild 会根据 app.json 生成 ios/ 原生工程。
      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # 自动检测 workspace 与 scheme，避免硬编码（app 名是中文，workspace/scheme 名可能被转义或含空格）
      - name: Detect workspace and scheme
        id: detect
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); s=d.get('workspace',{}).get('schemes') or d.get('project',{}).get('schemes') or []; print(s[0] if s else '')")
          if [ -z "$SCHEME" ]; then echo "::error::No scheme found"; exit 1; fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected workspace: $WORKSPACE"
          echo "Detected scheme:    $SCHEME"

      # 关键：CODE_SIGNING_ALLOWED=NO 产出未签名 .app
      # 完整输出存 build.log，失败时由下一步提取真正的 error 行并上传日志
      - name: Build unsigned archive
        id: xcbuild
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/app.xcarchive" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean archive 2>&1 | tee build/xcodebuild.log

      - name: Extract build errors (on failure)
        if: failure() && steps.xcbuild.outcome == 'failure'
        working-directory: ios
        run: |
          echo "↓↓↓ xcodebuild error lines ↓↓↓"
          grep -E "error:|fatal error:|❌" build/xcodebuild.log | grep -v "note:" | head -80 || true
          echo "↑↑↑ end of error lines ↑↑↑"

      - name: Upload build log (on failure)
        if: failure() && steps.xcbuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          retention-days: 7

      # 把 .app 装进 Payload/ 再压成 .ipa（Sideloadly 会重签名）；文件名带形态后缀
      - name: Package IPA
        working-directory: ios
        run: |
          MODE=${{ inputs.mode == 'offline' && 'offline' || 'online' }}
          mkdir -p build/Payload
          cp -r build/app.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -q "kaoyan-unsigned-${MODE}.ipa" Payload
          cd ..
          echo "IPA size: $(du -h kaoyan-unsigned-${MODE}.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-unsigned-${{ inputs.mode == 'offline' && 'offline' || 'online' }}-ipa
          path: ios/kaoyan-unsigned-*.ipa
          retention-days: 14
