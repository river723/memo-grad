name: Build Unsigned iOS IPA

# 在 Windows 上无 Mac、无付费 Apple 账号时，用 GitHub 托管的 macOS runner
# 构建「未签名 ipa」，再用 Sideloadly 在本机拿免费 Apple ID 重签名安装。
# 详见 .claude/plans/ipad-iphone-sprightly-moore.md

on:
  workflow_dispatch:      # 允许在 Actions 页面手动触发
  push:
    branches: [main, NetDict]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'webpack.config.js'
      - 'assets/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://192.168.1.8:5888
      # CI 环境跳过交互式更新检查
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 显式选择最新的 Xcode 16.x。expo-modules-core 55 用到了 Swift 6.1 的
      # 「隔离一致性」语法（如 `class ... : @MainActor Protocol`），需要 Xcode 16.3+，
      # 否则报 "unknown attribute 'MainActor'"。不选 Xcode 26 是因为 RN 0.83/Expo 55
      # 针对 Xcode 16 验证，26 过新。
      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 16.x found"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swiftc --version

      # Expo SDK 55 使用本地 CLI（npx expo），无需全局 expo-cli / eas-cli。
      # prebuild 会根据 app.json 生成 ios/ 原生工程。
      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # 自动检测 workspace 与 scheme，避免硬编码（app 名是中文，workspace/scheme 名可能被转义或含空格）
      - name: Detect workspace and scheme
        id: detect
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); s=d.get('workspace',{}).get('schemes') or d.get('project',{}).get('schemes') or []; print(s[0] if s else '')")
          if [ -z "$SCHEME" ]; then echo "::error::No scheme found"; exit 1; fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected workspace: $WORKSPACE"
          echo "Detected scheme:    $SCHEME"

      # 关键：CODE_SIGNING_ALLOWED=NO 产出未签名 .app
      # 完整输出存 build.log，失败时由下一步提取真正的 error 行并上传日志
      - name: Build unsigned archive
        id: xcbuild
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/app.xcarchive" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean archive 2>&1 | tee build/xcodebuild.log

      - name: Extract build errors (on failure)
        if: failure() && steps.xcbuild.outcome == 'failure'
        working-directory: ios
        run: |
          echo "↓↓↓ xcodebuild error lines ↓↓↓"
          grep -E "error:|fatal error:|❌" build/xcodebuild.log | grep -v "note:" | head -80 || true
          echo "↑↑↑ end of error lines ↑↑↑"

      - name: Upload build log (on failure)
        if: failure() && steps.xcbuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          retention-days: 7

      # 把 .app 装进 Payload/ 再压成 .ipa（Sideloadly 会重签名）
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -r build/app.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -q ../kaoyan-unsigned.ipa Payload
          cd ..
          echo "IPA size: $(du -h kaoyan-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-unsigned-ipa
          path: ios/kaoyan-unsigned.ipa
          retention-days: 14
